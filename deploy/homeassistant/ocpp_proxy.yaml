# Home Assistant package for the OCPP proxy.
#
# Install to  /config/packages/ocpp_proxy.yaml  and make sure configuration.yaml
# has:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# then restart Home Assistant. See README.md in this directory.
#
# ---------------------------------------------------------------------------
# Message shapes these templates rely on, from live traffic:
#
#   Call        payload = [2, "<uniqueId>", "<Action>", {args}]   -> args at [3]
#   CallResult  payload = [3, "<uniqueId>", {args}]               -> args at [2]
#
# So charger/* topics read payload[3] and central_system/* read payload[2].
# Getting that backwards is the easiest mistake here and yields silent
# "unknown" sensors.
#
# MeterValues does NOT always carry transactionId — observed both with and
# without on the same charger — so nothing may depend on it being present.
#
# Entity IDs: because these sensors declare a `device:`, Home Assistant builds
# each entity_id from the device name plus the sensor name, giving
# `sensor.@CHARGE_POINT_SLUG@_charger_power` rather than
# `sensor.charger_power`. The template sensors and the dashboard reference the
# full IDs accordingly. Renaming them afterwards in the UI does not change the
# unique_id, so the dashboard would need updating to match if you do.
# ---------------------------------------------------------------------------

mqtt:
  # =========================================================================
  # Live electrical measurements, from MeterValues
  # =========================================================================
  sensor:
    - name: "Charger Power"
      unique_id: ocpp_charger_power
      state_topic: "ocpp/@CHARGE_POINT_ID@/charger/MeterValues"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      # `| first` raises on an empty sequence, so the list is materialised and
      # length-checked instead. This charger sends reduced MeterValues with
      # only some measurands present; the naive form errors the template and
      # the sensor goes unavailable.
      value_template: >-
        {% set sv = value_json.payload[3].meterValue | default([], true) | last %}
        {% set vals = (sv.sampledValue | default([], true))
             | selectattr('measurand', 'defined')
             | selectattr('measurand', 'eq', 'Power.Active.Import')
             | map(attribute='value') | list %}
        {{ (vals[0] | float(0)) | round(0) | int if vals else 0 }}
      availability: &proxy_availability
        - topic: "ocpp/@CHARGE_POINT_ID@/availability"
          payload_available: "online"
          payload_not_available: "offline"
      device: &charger_device
        identifiers: ["ocpp_proxy_@CHARGE_POINT_ID@"]
        name: "EV Charger (@CHARGE_POINT_ID@)"
        manufacturer: "Autel"
        model: "MaxiCharger via OCPP proxy"

    # Lifetime meter register. state_class total_increasing makes this usable
    # by the Home Assistant Energy dashboard directly.
    - name: "Charger Energy Meter"
      unique_id: ocpp_charger_energy_meter
      state_topic: "ocpp/@CHARGE_POINT_ID@/charger/MeterValues"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      value_template: >-
        {% set sv = value_json.payload[3].meterValue | default([], true) | last %}
        {% set vals = (sv.sampledValue | default([], true))
             | selectattr('measurand', 'defined')
             | selectattr('measurand', 'eq', 'Energy.Active.Import.Register')
             | map(attribute='value') | list %}
        {{ ((vals[0] | float(0)) / 1000) | round(3) if vals else this.state }}
      availability: *proxy_availability
      device: *charger_device

    - name: "Charger Current L1"
      unique_id: ocpp_charger_current_l1
      state_topic: "ocpp/@CHARGE_POINT_ID@/charger/MeterValues"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      value_template: >-
        {% set sv = value_json.payload[3].meterValue | default([], true) | last %}
        {% set vals = (sv.sampledValue | default([], true))
             | selectattr('measurand', 'defined')
             | selectattr('measurand', 'eq', 'Current.Import')
             | selectattr('phase', 'defined')
             | selectattr('phase', 'eq', 'L1')
             | map(attribute='value') | list %}
        {{ (vals[0] | float(0)) | round(2) if vals else 0 }}
      availability: *proxy_availability
      device: *charger_device

    - name: "Charger Voltage L1"
      unique_id: ocpp_charger_voltage_l1
      state_topic: "ocpp/@CHARGE_POINT_ID@/charger/MeterValues"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: >-
        {% set sv = value_json.payload[3].meterValue | default([], true) | last %}
        {% set vals = (sv.sampledValue | default([], true))
             | selectattr('measurand', 'defined')
             | selectattr('measurand', 'eq', 'Voltage')
             | selectattr('phase', 'defined')
             | selectattr('phase', 'eq', 'L1')
             | map(attribute='value') | list %}
        {{ (vals[0] | float(0)) | round(1) if vals else 0 }}
      availability: *proxy_availability
      device: *charger_device

    # =======================================================================
    # Charge point state, from StatusNotification
    # =======================================================================
    # These read the RETAINED state topic, not the StatusNotification event
    # topic. Events are published non-retained, so a subscriber that connects
    # afterwards — Home Assistant restarting — sees nothing until the charger
    # next changes state, which overnight can be hours. The retained snapshot
    # is delivered the instant HA subscribes.
    - name: "Charger Status"
      unique_id: ocpp_charger_status
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      icon: mdi:ev-station
      # Available / Preparing / Charging / SuspendedEV / SuspendedEVSE /
      # Finishing / Reserved / Unavailable / Faulted
      value_template: "{{ value_json.connector_status | default('Unknown', true) }}"
      json_attributes_topic: "ocpp/@CHARGE_POINT_ID@/state"
      availability: *proxy_availability
      device: *charger_device

    - name: "Charger Error Code"
      unique_id: ocpp_charger_error_code
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      icon: mdi:alert-circle-outline
      value_template: "{{ value_json.error_code | default('NoError', true) }}"
      availability: *proxy_availability
      device: *charger_device

    # =======================================================================
    # Transaction, from StartTransaction / StopTransaction
    # =======================================================================
    # Also from the retained snapshot: the proxy folds the Central System's
    # StartTransaction result into it and clears it on StopTransaction, so an
    # ended session does not leave a stale id looking like an open one.
    - name: "Charger Transaction ID"
      unique_id: ocpp_charger_transaction_id
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      icon: mdi:identifier
      value_template: "{{ value_json.transaction_id | default('none', true) }}"
      availability: *proxy_availability
      device: *charger_device

    - name: "Charger Authorization"
      unique_id: ocpp_charger_authorization
      state_topic: "ocpp/@CHARGE_POINT_ID@/central_system/Authorize"
      icon: mdi:card-account-details-outline
      value_template: "{{ value_json.payload[2].idTagInfo.status | default('Unknown', true) }}"
      availability: *proxy_availability
      device: *charger_device

    # Meter reading at the moment the transaction opened, from the retained
    # snapshot. Marked unavailable while no transaction is open, rather than
    # reporting a stale or zero figure that would make session energy wrong.
    - name: "Charger Session Meter Start"
      unique_id: ocpp_charger_session_meter_start
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      device_class: energy
      state_class: total
      unit_of_measurement: "kWh"
      value_template: >-
        {{ ((value_json.meter_start_wh | default(0, true)) | float(0) / 1000) | round(3) }}
      availability_mode: all
      availability:
        - topic: "ocpp/@CHARGE_POINT_ID@/availability"
          payload_available: "online"
          payload_not_available: "offline"
        - topic: "ocpp/@CHARGE_POINT_ID@/state"
          value_template: >-
            {{ 'online' if (value_json.meter_start_wh | default(none)) is not none else 'offline' }}
          payload_available: "online"
          payload_not_available: "offline"
      device: *charger_device

    # The two sensors below describe the session that most recently ENDED.
    #
    # They read the retained snapshot rather than the StopTransaction event
    # topic they used to. That topic is published non-retained, so after a
    # Home Assistant restart both sat at `unknown` until another session
    # happened to end — which, with a car charged twice a week, is days of a
    # blank row on the dashboard. The proxy keeps these fields across the next
    # session precisely so this topic can answer the question at any time.
    #
    # `unique_id` is unchanged for the meter-stop sensor and it reports the
    # same quantity as before, so its recorder history stays continuous.
    - name: "Charger Last Session Energy"
      unique_id: ocpp_charger_last_session_energy
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      device_class: energy
      state_class: total
      unit_of_measurement: "kWh"
      # The lifetime register reading at the moment the last session closed —
      # not the energy that session delivered. That is the sensor below.
      value_template: >-
        {{ ((value_json.last_meter_stop_wh | default(0, true)) | float(0) / 1000) | round(3) }}
      json_attributes_topic: "ocpp/@CHARGE_POINT_ID@/state"
      availability_mode: all
      availability:
        - topic: "ocpp/@CHARGE_POINT_ID@/availability"
          payload_available: "online"
          payload_not_available: "offline"
        - topic: "ocpp/@CHARGE_POINT_ID@/state"
          value_template: >-
            {{ 'online' if (value_json.last_meter_stop_wh | default(none)) is not none else 'offline' }}
          payload_available: "online"
          payload_not_available: "offline"
      device: *charger_device

    # Energy the last completed session actually delivered: meterStop minus
    # meterStart, computed by the proxy while both were known.
    #
    # The proxy reports null rather than zero when it never saw the matching
    # StartTransaction — a restart mid-session — and the availability template
    # below turns that into `unavailable`. A zero here would silently understate
    # a real charge.
    - name: "Charger Last Session Delivered"
      unique_id: ocpp_charger_last_session_delivered
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      device_class: energy
      state_class: total
      unit_of_measurement: "kWh"
      icon: mdi:battery-charging
      value_template: >-
        {{ ((value_json.last_session_energy_wh | default(0, true)) | float(0) / 1000) | round(3) }}
      availability_mode: all
      availability:
        - topic: "ocpp/@CHARGE_POINT_ID@/availability"
          payload_available: "online"
          payload_not_available: "offline"
        - topic: "ocpp/@CHARGE_POINT_ID@/state"
          value_template: >-
            {{ 'online' if (value_json.last_session_energy_wh | default(none)) is not none else 'offline' }}
          payload_available: "online"
          payload_not_available: "offline"
      device: *charger_device

    - name: "Charger Last Session End Reason"
      unique_id: ocpp_charger_last_session_end_reason
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      icon: mdi:power-plug-off-outline
      # Optional in OCPP 1.6 and omitted by this charger on some stops, hence
      # the explicit fallback rather than an availability gate — the row should
      # stay on the dashboard next to the figures it explains.
      value_template: >-
        {{ value_json.last_stop_reason | default('Unknown', true) }}
      availability: *proxy_availability
      device: *charger_device

    # =======================================================================
    # Proxy and link health
    # =======================================================================
    # This topic is retained, so these survive a Home Assistant restart.
    - name: "OCPP Proxy Upstream"
      unique_id: ocpp_proxy_upstream
      state_topic: "ocpp/@CHARGE_POINT_ID@/status"
      icon: mdi:cloud-outline
      value_template: "{{ value_json.upstream | default('unknown', true) }}"
      device: *charger_device

    - name: "OCPP Proxy Downstream"
      unique_id: ocpp_proxy_downstream
      state_topic: "ocpp/@CHARGE_POINT_ID@/status"
      icon: mdi:ev-plug-type2
      value_template: "{{ value_json.downstream | default('unknown', true) }}"
      device: *charger_device

    # =======================================================================
    # Charging-current control — the proxy's own OCPP commands
    # =======================================================================
    # Only useful when the proxy runs with `charging.enabled: true`; otherwise
    # every command is answered `rejected` (or nothing subscribes at all) and
    # these read `none`/`unknown`, which is truthful.

    # Outcome of the most recent limit command, from the retained snapshot:
    # accepted / rejected / error / timeout. The standing limit itself is the
    # `number` entity below; this is what tells you a new limit did NOT take,
    # instead of the slider quietly keeping the old figure.
    - name: "Charger Current Limit Status"
      unique_id: ocpp_charger_current_limit_status
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      icon: mdi:shield-check-outline
      value_template: "{{ value_json.current_limit_status | default('none', true) }}"
      json_attributes_topic: "ocpp/@CHARGE_POINT_ID@/state"
      json_attributes_template: >-
        {{ {'current_limit_a': value_json.current_limit_a | default(none),
            'current_limit_updated': value_json.current_limit_updated | default(none)} | tojson }}
      availability: *proxy_availability
      device: *charger_device

    # Every command — limit or not — ends in exactly one message on the result
    # topic. State is the status; the whole result rides along as attributes,
    # so `get_configuration` output lands here too.
    - name: "Charger Last Command"
      unique_id: ocpp_charger_last_command
      state_topic: "ocpp/@CHARGE_POINT_ID@/command/result"
      icon: mdi:console-line
      value_template: "{{ value_json.status | default('unknown', true) }}"
      json_attributes_topic: "ocpp/@CHARGE_POINT_ID@/command/result"
      availability: *proxy_availability
      device: *charger_device

    # What the charger is offering the car. This Autel reports the offer as
    # Power.Offered (W), not Current.Offered — seen live 2026-09-22 — so that
    # is the measurand read here. The direct evidence that a limit took:
    # 20 A on one phase should show as roughly 4600 W while the car draws.
    - name: "Charger Power Offered"
      unique_id: ocpp_charger_power_offered
      state_topic: "ocpp/@CHARGE_POINT_ID@/charger/MeterValues"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: >-
        {% set sv = value_json.payload[3].meterValue | default([], true) | last %}
        {% set vals = (sv.sampledValue | default([], true))
             | selectattr('measurand', 'defined')
             | selectattr('measurand', 'eq', 'Power.Offered')
             | map(attribute='value') | list %}
        {%- if vals %}{{ (vals[0] | float(0)) | round(0) | int }}
        {%- elif this.state not in ['unknown', 'unavailable', none] %}{{ this.state }}
        {%- else %}None{% endif %}
      availability: *proxy_availability
      device: *charger_device

  binary_sensor:
    # Driven by the proxy's MQTT Last Will. This is the ONLY thing that tells
    # you the proxy has died — nothing else watches that process, and with the
    # APN SIM in the dongle the proxy is the charger's only path to Mobi.e.
    # Alert on this.
    - name: "OCPP Proxy Online"
      unique_id: ocpp_proxy_online
      state_topic: "ocpp/@CHARGE_POINT_ID@/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      device: *charger_device

  # =========================================================================
  # Charging-current limit — the control
  # =========================================================================
  # Publishes the slider value as a bare number to the proxy's convenience
  # topic; the proxy turns it into a SetChargingProfile on the charger and the
  # accepted value comes back through the retained snapshot, which is what the
  # slider displays. Not optimistic: the slider shows what the charger took,
  # not what was asked. A request over the proxy's ceiling is clamped there
  # and the status sensor's `detail` says so.
  #
  # 0 pauses charging (the transaction stays open); 1–5 A are sent as 0 too,
  # because an EV will not charge under 6 A. `max` here is the slider's range
  # only — the ceiling that is actually enforced is `charging.max_limit_a` in
  # the proxy's config.
  number:
    - name: "Charger Current Limit"
      unique_id: ocpp_charger_current_limit
      command_topic: "ocpp/@CHARGE_POINT_ID@/command/current_limit"
      state_topic: "ocpp/@CHARGE_POINT_ID@/state"
      # `default(none)` without the boolean: only a missing key becomes None,
      # a legitimate 0 A stays 0. Rendering "None" resets the entity to
      # unknown (payload_reset), which is the truth when no limit is set.
      value_template: >-
        {% set v = value_json.current_limit_a | default(none) %}
        {{ v if v is not none else 'None' }}
      payload_reset: "None"
      min: 0
      max: 32
      step: 1
      mode: slider
      unit_of_measurement: "A"
      device_class: current
      icon: mdi:current-ac
      qos: 1
      retain: false
      optimistic: false
      availability: *proxy_availability
      device: *charger_device

  button:
    - name: "Charger Clear Current Limit"
      unique_id: ocpp_charger_clear_current_limit
      command_topic: "ocpp/@CHARGE_POINT_ID@/command"
      payload_press: '{"command": "clear_current_limit", "id": "ha-clear-limit"}'
      icon: mdi:lock-open-variant-outline
      qos: 1
      availability: *proxy_availability
      device: *charger_device

    # The answer lands in sensor.<slug>_charger_last_command's attributes.
    - name: "Charger Read Configuration"
      unique_id: ocpp_charger_read_configuration
      command_topic: "ocpp/@CHARGE_POINT_ID@/command"
      payload_press: '{"command": "get_configuration", "id": "ha-get-configuration"}'
      icon: mdi:file-document-outline
      qos: 1
      availability: *proxy_availability
      device: *charger_device

    - name: "Charger Read Applied Limit"
      unique_id: ocpp_charger_read_applied_limit
      command_topic: "ocpp/@CHARGE_POINT_ID@/command"
      payload_press: '{"command": "get_composite_schedule", "duration_s": 3600, "id": "ha-composite-schedule"}'
      icon: mdi:chart-timeline-variant
      qos: 1
      availability: *proxy_availability
      device: *charger_device

# =========================================================================
# Derived values
# =========================================================================
template:
  - sensor:
      # Energy delivered in the session currently in progress.
      #
      # Caveat worth knowing: meter_start only arrives on a StartTransaction
      # message, which is not retained. After a Home Assistant restart mid-
      # session this reads "unknown" until the next transaction begins. The
      # lifetime register and the Energy dashboard are unaffected.
      - name: "Charger Session Energy"
        unique_id: ocpp_charger_session_energy
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        availability: >-
          {{ states('sensor.@CHARGE_POINT_SLUG@_charger_energy_meter') not in ['unknown', 'unavailable', 'none']
             and states('sensor.@CHARGE_POINT_SLUG@_charger_session_meter_start') not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set now_kwh = states('sensor.@CHARGE_POINT_SLUG@_charger_energy_meter') | float(0) %}
          {% set start_kwh = states('sensor.@CHARGE_POINT_SLUG@_charger_session_meter_start') | float(0) %}
          {{ [now_kwh - start_kwh, 0] | max | round(3) }}

      - name: "Charger Charging"
        unique_id: ocpp_charger_is_charging
        icon: mdi:flash
        state: >-
          {{ 'on' if states('sensor.@CHARGE_POINT_SLUG@_charger_status') == 'Charging' else 'off' }}
