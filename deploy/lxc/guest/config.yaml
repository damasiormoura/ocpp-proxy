# OCPP proxy configuration — TEMPLATE.
#
# Rendered by deploy/render.sh, which fills in the placeholder tokens from
# deploy/local.env. Install the rendered copy to /etc/ocpp-proxy/config.yaml
# (mode 644, root:ocpp).
#
# Everything site-specific — the Charge Point ID, the Central System address,
# the broker address — is a deployment parameter and is deliberately not in this
# repository. See deploy/local.env.example for the full list.
#
# Secrets do NOT go here, rendered or not. See secrets.env.

# --- Central System --------------------------------------------------------
# Base URL only: the proxy appends /{Charge_Point_ID}.
#
# Plaintext ws:// is the norm for a Central System reached over a private APN,
# where the APN itself is the security boundary and there is no TLS on offer.
# Use wss:// if yours provides it.
#
# If the host is a literal address the mobile path needs no DNS at all, which
# removes a dependency worth removing — APNs of this kind frequently serve no
# resolver. If it is a name, confirm it resolves through the APN's resolvers
# and add a domain-specific dnsmasq entry on the host if it does not.
central_system_url: "@CENTRAL_SYSTEM_URL@"

# Charge Point ID, used for the MQTT Last Will and Testament topic
# (ocpp/{id}/availability). It must be configured here rather than taken from
# the charger's connection, because the will has to be registered in the MQTT
# CONNECT packet — before any charger has connected to tell us its ID.
#
# Without it there is no Last Will, and nothing tells Home Assistant when this
# proxy dies unexpectedly. That is the only signal it gets: no orchestrator is
# watching this process.
charge_point_id: "@CHARGE_POINT_ID@"

# Local source address for the upstream socket. Only needed when egress has to
# be selected by source address; a destination route to the Central System's
# network is simpler and is what the reference deployment uses.
# upstream_bind_address: "@UPSTREAM_BIND_ADDRESS@"

# --- Charger-facing listener ----------------------------------------------
# 0.0.0.0 binds every leg, so the charger is served whichever network it is
# on. That is the right default for a multi-homed container whose charger may
# move between an IoT VLAN and a general home network; restricting exposure is
# then the hypervisor firewall's job rather than this file's.
#
# Set a specific address instead if the container has exactly one path to the
# charger and you want the listener off the others.
listen_address: "@LISTEN_ADDRESS@"
listen_port: @LISTEN_PORT@

health_port: @HEALTH_PORT@

# --- MQTT ------------------------------------------------------------------
# TLS is optional and omitted by default: the broker is normally one LAN hop
# away rather than across the internet. To enable it, set ca_cert_path
# (server-auth) and optionally client_cert_path + client_key_path (mutual).
mqtt:
  host: "@MQTT_HOST@"
  port: @MQTT_PORT@
  # username / password come from secrets.env

# --- Durable state ---------------------------------------------------------
# Where the retained charge point snapshot is kept, so the previous session's
# figures survive a restart of this service rather than going `unavailable` in
# Home Assistant until the next charge ends.
#
# The directory is created by `StateDirectory=ocpp-proxy` in the unit file.
# Set to "" to turn persistence off.
state_file: "/var/lib/ocpp-proxy/state.json"

logging:
  level: INFO

buffers:
  message_buffer_size: 100
  mqtt_buffer_size: 500
  max_backoff_seconds: 60

# --- Charger control -------------------------------------------------------
# The proxy's own OCPP commands towards the charger: a charging-current limit
# set from Home Assistant (number.<slug>_charger_current_limit), plus reading
# the charger's configuration. See README.md, "Charger control".
#
# Enabled here because that is what this deployment is for. Two things to
# know before relying on it:
#
#   * The broker accepts anonymous connections (deliberately — see
#     deploy/lxc/README.md). Anyone who can reach EMQX can therefore publish
#     a limit. The ceiling below bounds the damage to "the car charges slower
#     or pauses". To lock it down, add an EMQX ACL denying publish on
#     ocpp/+/command/# to all but the Home Assistant user.
#
#   * max_limit_a is a hard ceiling, not the working limit. 28 A is the
#     charger's own maximum (GetCompositeSchedule, 2026-09-22), so the ceiling
#     no longer holds anything back: under a 6.9 kVA contract (30 A) a car
#     drawing 28 A leaves 0.5 kW for the house. Keeping the house under the
#     contract is the Home Assistant load-balancing package's job — its own
#     ceiling (input_number.ev_charger_max_current_a, 20 A by default) and the
#     headroom computed from the mains meter. Was 20 A from the first deploy
#     until the owner raised it on 2026-09-22.
charging:
  enabled: true
  max_limit_a: 28
  min_limit_a: 6
  connector_id: 0
  purpose: TxDefaultProfile
  profile_kind: Absolute
  rate_unit: A
  number_phases: 1
  command_timeout_seconds: 30
  reapply_on_connect: true
