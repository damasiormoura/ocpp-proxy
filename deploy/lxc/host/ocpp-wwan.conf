# Proxmox host networking for the OCPP proxy's Mobi.e egress path.
#
# Install to /etc/network/interfaces.d/ocpp-wwan on the Proxmox host.
# /etc/network/interfaces already ends with "source /etc/network/interfaces.d/*",
# so no edit to the main file is needed.
#
# ---------------------------------------------------------------------------
# MEASURED 2026-08-31 with the SIM installed:
#   dongle LAN 192.168.0.0/24, gateway 192.168.0.1, DHCP offered .169
#   modem_main_state=modem_init_complete  network_type=LTE  signalbar=5
#   ppp_status=ppp_connected  network_provider=NOS
#
# Confirm the dongle's DHCP pool range in its web UI and, if .169 falls inside
# it, move this static address outside the pool.
#
# Static, not DHCP, deliberately: a DHCP lease from the dongle installs a
# default route into the main table, which would pull host traffic — Proxmox
# updates, the Claude runners, everything — over a metered mobile link. A
# static address with no "gateway" line cannot do that.
# ---------------------------------------------------------------------------

# Point-to-point bridge carrying only the proxy's Mobi.e traffic.
# No physical port; the OCPP LXC gets the .2 address on it.
auto vmbr2
iface vmbr2 inet static
    address 10.80.0.1/30
    bridge-ports none
    bridge-stp off
    bridge-fd 0

# allow-hotplug, not auto: this is a removable USB device. With "auto",
# ifupdown tries to bring it up at boot and the networking service fails when
# the dongle is absent. With allow-hotplug it is configured whenever udev says
# the interface has appeared, and its absence is a non-event.
allow-hotplug wwan0
iface wwan0 inet static
    address 192.168.0.169/24
    # NO "gateway" line. The LAN default route stays the host's only one.

    # Mobi.e lives at ws://10.200.10.200/ocpp/1.6/MOBI-ALM-00058 — a fixed
    # RFC1918 range reachable only inside the APN, colliding with nothing on
    # this network. A destination route is therefore enough; no policy rules,
    # no routing tables, and nothing for the application to configure.
    post-up  ip route replace 10.200.10.0/24 via 192.168.0.1 dev wwan0
    pre-down ip route del 10.200.10.0/24 || true

    # Source NAT: the APN gives one address, and the dongle NATs again behind
    # it. Double NAT is harmless for an outbound WebSocket.
    post-up  iptables -t nat -C POSTROUTING -s 10.80.0.0/30 -o wwan0 -j MASQUERADE 2>/dev/null || \
             iptables -t nat -A POSTROUTING -s 10.80.0.0/30 -o wwan0 -j MASQUERADE
    pre-down iptables -t nat -D POSTROUTING -s 10.80.0.0/30 -o wwan0 -j MASQUERADE 2>/dev/null || true

    # Clamp MSS to path MTU. Mobile APNs commonly present MTU < 1500; without
    # this the handshake and small OCPP frames succeed while larger frames
    # stall, which reads as an application bug and is expensive to diagnose.
    post-up  iptables -t mangle -C FORWARD -o wwan0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || \
             iptables -t mangle -A FORWARD -o wwan0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
    pre-down iptables -t mangle -D FORWARD -o wwan0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
