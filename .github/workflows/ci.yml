name: CI

# Build, lint and test on every push and pull request.
#
# Runs on the self-hosted runner in LXC 106. That container has Docker but no
# Rust toolchain, so the toolchain comes from a container image rather than
# being installed into the runner — which also keeps the build reproducible and
# leaves nothing to drift on the host.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # bookworm, not trixie: its glibc is older than the deployment target's, so a
  # binary built here runs there. The reverse would not hold.
  RUST_IMAGE: rust:1-bookworm
  # Outside the workspace on purpose — checkout wipes the workspace every run.
  CACHE_ROOT: /home/runner/.cache/ocpp-proxy

jobs:
  build-and-test:
    runs-on: [self-hosted, ocpp-proxy]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # The official rust image ships rustup's minimal profile — no rustfmt, no
      # clippy — and runs as root, which left a root-owned target/ in the
      # workspace that the next run's checkout could not delete (EACCES on
      # target/CACHEDIR.TAG). Both are fixed here: the components are baked in
      # once, and every cargo step runs as the runner's own uid with CARGO_HOME
      # and target/ mounted from caches outside the workspace, so nothing
      # root-owned is ever written into the checkout.

      - name: Prepare build image and caches
        run: |
          mkdir -p "$CACHE_ROOT/cargo" "$CACHE_ROOT/target"
          printf '%s\n' \
            "FROM $RUST_IMAGE" \
            "RUN rustup component add rustfmt clippy" \
            | docker build -q -t ocpp-proxy-rust:local -

      - name: Format
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -v "$PWD:/w" -w /w \
            -v "$CACHE_ROOT/cargo:/cargo" \
            -v "$CACHE_ROOT/target:/w/target" \
            ocpp-proxy-rust:local cargo fmt --check

      - name: Clippy
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -v "$PWD:/w" -w /w \
            -v "$CACHE_ROOT/cargo:/cargo" \
            -v "$CACHE_ROOT/target:/w/target" \
            ocpp-proxy-rust:local cargo clippy --all-targets -- -D warnings

      - name: Test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -v "$PWD:/w" -w /w \
            -v "$CACHE_ROOT/cargo:/cargo" \
            -v "$CACHE_ROOT/target:/w/target" \
            ocpp-proxy-rust:local cargo test --all-targets

      - name: Release build
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -v "$PWD:/w" -w /w \
            -v "$CACHE_ROOT/cargo:/cargo" \
            -v "$CACHE_ROOT/target:/w/target" \
            ocpp-proxy-rust:local cargo build --release
          sha256sum "$CACHE_ROOT/target/release/ocpp-proxy"
      # The Home Assistant templates have no compiler behind them and fail
      # silently — a template that raises takes its sensor `unavailable` rather
      # than logging anything obvious. This renders them against captured
      # payload shapes and asserts state and availability for each.

      - name: Home Assistant template checks
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3-slim sh -c \
            'pip install --quiet pyyaml jinja2 &&
             python3 deploy/homeassistant/render_check.py'

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: ocpp-proxy-${{ github.sha }}
          path: /home/runner/.cache/ocpp-proxy/target/release/ocpp-proxy
          retention-days: 14
          if-no-files-found: error
